plugins {
	// Minecraft 26.1+ is unobfuscated -> use the non-remap Loom variant
	// (net.fabricmc.fabric-loom). Loom skips all remapping; the deliverable is
	// the plain `jar` task output (there is no remapJar task).
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"fishingrodfix" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

// No access widener: on 26.3 the render state the code reads is public; the private members
// (SpriteContents.originalImage, Camera.eyeHeight/eyeHeightOld, GameRenderer.bobHurt/bobView) go
// through mixin @Accessor/@Invoker.

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// No `mappings` line: 26.1+ ships unobfuscated official Mojang names.
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// No Fabric API: the mod doesn't use it, and leaving it off the classpath keeps compile and
	// runClient honest about running without it. MixinExtras, the mod's only mixin extra, comes
	// from the loader's own bundled copy and is deliberately NOT Jar-in-Jar'd here: every loader
	// from 0.15.7 on bundles a MixinExtras with injector.v2.WrapWithCondition, far below this
	// branch's floor, so an include(...) would lower nothing. (The 1.20 branch, at JAVA_17, does
	// bundle one.)
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Also builds fishingrodfix-<mod_version>-sources.jar alongside the mod jar.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// Name the final jar in build/libs as:
//   fishingrodfix-<minecraft_version>-v<mod_version>.jar
// On unobfuscated MC there is no remapJar task, so the name is set on `jar`.
// fabric.mod.json's "version" field stays = mod_version.
jar {
	archiveFileName = "${project.archives_base_name}-${project.minecraft_version}-v${project.mod_version}.jar"
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
