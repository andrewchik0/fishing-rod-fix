plugins {
	// Minecraft 1.21.1 is obfuscated -> the remapping Loom variant (net.fabricmc.fabric-loom-remap):
	// the code compiles against yarn names and Loom remaps it to intermediary; the deliverable is the
	// remapJar output.
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"fishingrodfix" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// No access widener: the private members the code reads go through mixin @Accessor/@Invoker.

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// No Fabric API: the mod doesn't use it, and leaving it off the classpath keeps compile and
	// runClient honest about running without it. MixinExtras, the mod's only mixin extra, comes
	// from the loader's own bundled copy and is deliberately NOT Jar-in-Jar'd here:
	// depends.fabricloader is already >=0.15.10 for the JAVA_21 compatibility level, and every
	// loader from 0.15.7 on bundles a MixinExtras with injector.v2.WrapWithCondition, so an
	// include(...) would lower nothing. (The 1.20 branch, at JAVA_17, does bundle one.)
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Also builds fishingrodfix-<mod_version>-sources.jar alongside the mod jar (Loom attaches it to
	// remapSourcesJar and to build).
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// Name the final remapped jar in build/libs as:
//   fishingrodfix-1.21-1.21.1-v<mod_version>.jar  (e.g. fishingrodfix-1.21-1.21.1-v0.6.jar)
// One build covers the whole 1.21-1.21.1 range (identical render API; see CLAUDE.md and
// depends.minecraft in fabric.mod.json), so the label is the range, not minecraft_version
// (= 1.21.1, the version it is compiled and tested against). Set on remapJar only (jar above
// builds the dev jar), so fabric.mod.json's "version" field stays = mod_version.
tasks.named('remapJar') {
	archiveFileName = "${project.archives_base_name}-1.21-1.21.1-v${project.mod_version}.jar"
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
