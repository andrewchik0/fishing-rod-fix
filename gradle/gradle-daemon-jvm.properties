# Java version the Gradle daemon runs on (Gradle's daemon JVM criteria). Gradle picks a matching
# JDK among the installed ones (incl. IntelliJ's ~/.jdks) whatever JAVA_HOME or PATH say, so this
# branch builds from any shell. Each version branch sets its own: 26.x needs 25, older ones 21.
# No download URLs: a missing JDK fails the build instead of being fetched.
toolchainVersion=25
