# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.20.1
yarn_mappings=1.20.1+build.10
loader_version=0.19.5
loom_version=1.17-SNAPSHOT

# MixinExtras, shaded into the jar under our own package (build.gradle's shadeJar) instead of
# nesting the library mod or relying on the loader's copy. Keep this equal to the version
# fabric-loader (loader_version above) pulls onto the compile classpath, so the annotations the code
# is compiled against and the copy that reads them at runtime are the same release.
mixinextras_version=0.5.5
# Gradle plugin that does the shading; only shadeJar uses it.
shadow_version=9.6.1

# Mod Properties
mod_version=0.6
maven_group=com.andrewchik.fishingrodfix
archives_base_name=fishingrodfix
